services:
  db:
    image: docker.io/library/postgres:17-alpine
    environment:
      POSTGRES_USER: gallery
      POSTGRES_PASSWORD: gallery-local-dev
      POSTGRES_DB: gallery
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - gallery_dev_db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gallery -d gallery"]
      interval: 5s
      timeout: 3s
      retries: 15
volumes:
  gallery_dev_db:
