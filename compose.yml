services:
  db:
    image: docker.io/library/postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: gallery
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: gallery
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gallery -d gallery"]
      interval: 5s
      timeout: 3s
      retries: 20
  migrate:
    build: .
    image: open-prompt-gallery:local
    command: ["node", "scripts/migrate.mjs"]
    environment:
      DATABASE_URL: postgresql://gallery:${POSTGRES_PASSWORD}@db:5432/gallery
    depends_on:
      db:
        condition: service_healthy
    restart: "no"
  app:
    build: .
    image: open-prompt-gallery:local
    restart: unless-stopped
    ports:
      - "${BIND_ADDRESS:-127.0.0.1}:${APP_PORT:-3000}:3000"
    environment:
      DATABASE_URL: postgresql://gallery:${POSTGRES_PASSWORD}@db:5432/gallery
      APP_PASSWORD: ${APP_PASSWORD:-}
      APP_ORIGIN: ${APP_ORIGIN:-http://localhost:3000}
      UPLOAD_DIR: /app/data/uploads
      RUN_MIGRATIONS: "false"
    volumes:
      - uploads:/app/data/uploads
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3
volumes:
  postgres_data:
  uploads:
